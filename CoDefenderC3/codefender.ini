[program:codefender]
command=/app/start_codefender.sh
directory=/app
priority=1
numprocs=1
autostart=true
autorestart=true
startretries=3
startsecs=10
exitcodes=0
stopsignal=KILL
stopasgroup=true
killasgroup=true
stopwaitsecs=10
redirect_stderr=false
stdout_logfile=/var/log/supervisor/codefender.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/codefender_err.log
stderr_logfile_maxbytes=10MB
stderr_logfile_backups=3
environment=CODEFENDER_MODEL_PATH="/app/ensemble.pkl",THRESHOLD="0.5",HOST="0.0.0.0",PORT="8000",OPENBLAS_NUM_THREADS="1",OMP_NUM_THREADS="1",MKL_NUM_THREADS="1",NUMEXPR_NUM_THREADS="1"